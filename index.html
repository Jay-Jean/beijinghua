<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#b93226"><meta name="description" content="把你想说的话翻译成北京话，手机直接用。"><title>北京话翻译器</title><style>
:root{--paper:#f8f4eb;--ink:#282a25;--red:#b93226;--line:#dcd6c9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,textarea{font:inherit}button{cursor:pointer}header{max-width:1120px;margin:auto;padding:25px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:2px;display:flex;align-items:center;gap:10px}.seal{background:var(--red);color:white;border-radius:7px;padding:7px 10px;font-family:serif;font-size:22px}.tag{font-size:12px;color:#737469;letter-spacing:2px}main{max-width:1064px;margin:0 auto;padding:48px 0}.intro{position:relative;padding:0 0 34px}.eyebrow{color:var(--red);font-size:12px;letter-spacing:3px;font-weight:700}h1{font-size:clamp(34px,6vw,62px);font-family:"Songti SC",STSong,serif;margin:16px 0;letter-spacing:1px;line-height:1.2}h1 em{font-style:normal;color:var(--red)}.desc{color:#77776c;font-size:15px;line-height:1.8}.stamp{position:absolute;right:10px;top:0;transform:rotate(9deg);border:2px solid var(--red);color:var(--red);padding:12px 8px;font:22px/1.25 serif;writing-mode:vertical-rl;border-radius:4px;letter-spacing:5px}.workspace{border:1px solid var(--line);border-radius:16px;background:#fffdf8;overflow:hidden;box-shadow:0 10px 35px #45381606}.panels{display:grid;grid-template-columns:1fr 1fr}.panel{padding:26px;min-width:0}.panel+.panel{border-left:1px solid var(--line);background:#f1eee4}.panelhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650;gap:8px}.number{font-size:11px;font-weight:500;color:#89877b}.clear{border:0;background:none;color:#888578;font-size:12px;padding:6px}.clear:hover{color:var(--red)}textarea{width:100%;height:195px;resize:vertical;border:0;background:transparent;outline:none;color:var(--ink);font-size:21px;line-height:1.85;margin-top:20px;padding:0;min-height:140px}textarea:focus{box-shadow:0 2px var(--red)}textarea::placeholder{color:#b0ac9f}.result{min-height:195px;max-height:450px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:25px;line-height:1.85;margin-top:20px;color:var(--red)}.empty{color:#b0ac9f;font-size:20px}.panelbottom{display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:12px}.hint{font-size:12px;color:#999487}.copy{border:0;border-radius:7px;background:var(--red);color:white;padding:12px 22px;font-weight:600;transition:background .2s}.copy:hover{background:#97271e}.copy:disabled{opacity:.4;cursor:default}.examples{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:19px 26px;border-top:1px solid var(--line)}.examples span{font-size:12px;color:#8c877a}.example{border:1px solid #e1dbce;background:transparent;border-radius:30px;padding:8px 13px;color:#6f6d61;font-size:12px}.example:hover{border-color:var(--red);color:var(--red)}.notes{display:flex;justify-content:space-between;margin-top:20px;gap:12px;color:#8c897e;font-size:12px;line-height:1.8}footer{border-top:1px solid var(--line);max-width:1120px;margin:25px auto 0;padding:22px 28px;color:#999589;display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px}.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 22px;border-radius:9px;font-size:14px;max-width:90%;text-align:center}.toast:empty{display:none}button:focus-visible{outline:3px solid #bf7e48;outline-offset:3px}@media(max-width:1120px){main{margin:0 28px}}@media(max-width:640px){header{padding:18px 20px}.tag{letter-spacing:0;font-size:11px}main{margin:0 18px;padding-top:34px}.intro{padding-bottom:23px}.desc{font-size:13px;padding-right:35px}.stamp{font-size:16px;right:0;padding:8px 5px}.panels{grid-template-columns:1fr}.panel{padding:20px}.panel+.panel{border-left:0;border-top:1px solid var(--line)}textarea{height:125px;min-height:100px;font-size:18px;margin-top:14px}.result{min-height:110px;font-size:22px;margin-top:14px;max-height:300px}.examples{padding:16px 20px;gap:8px}.notes{display:block}.notes span{display:block;margin:5px 0}footer{margin-top:8px;padding:20px;gap:12px;font-size:10px}h1{padding-right:35px}.copy{min-height:44px}}
</style></head><body>
<header><div class="brand"><span class="seal">京</span>北京话翻译器</div></header>
<main><section class="intro"><div class="eyebrow">BEIJING DIALECT TRANSLATOR</div><h1>方便您和当地人沟通</h1></section>
<section class="workspace" aria-label="北京话转换器"><div class="panels"><div class="panel"><div class="panelhead"><label for="input">你想说的话</label><button class="clear" id="clear" type="button">清空 ↗</button></div><textarea id="input" maxlength="10000" placeholder="来，随便说两句……" spellcheck="false"></textarea><div class="panelbottom"><span class="number" id="count">0 / 10000</span><span class="hint">输入即转换</span></div></div><div class="panel"><div class="panelhead"><label for="output">翻译结果</label></div><div id="output" class="result" role="region" aria-label="转换结果" aria-live="polite"></div><div class="panelbottom"><span class="hint">好嘞，您瞧瞧。</span><button id="copy" type="button" class="copy">复制结果 ↗</button></div></div></div><div class="examples"><span>试一句</span><button class="example" type="button">明天好像要下雨</button><button class="example" type="button">今天吃什么</button><button class="example" type="button">周末一起去散步吧</button></div></section>
</main>
<div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const input=document.getElementById('input'),output=document.getElementById('output'),copy=document.getElementById('copy');
function convert(text){return text.replace(/\p{Unified_Ideograph}|[〇]/gu,'$&儿');}
function update(){const value=convert(input.value);output.textContent=value||'翻译结果将在这里显示';output.classList.toggle('empty',!value);document.getElementById('count').textContent=input.value.length+' / 10000';copy.disabled=!input.value;}
input.addEventListener('input',update);document.getElementById('clear').addEventListener('click',()=>{input.value='';update();input.focus();});
document.querySelectorAll('.example').forEach(button=>button.addEventListener('click',()=>{input.value=button.textContent;update();}));
let timer;function toast(message){const el=document.getElementById('toast');el.textContent=message;clearTimeout(timer);timer=setTimeout(()=>el.textContent='',2500);}
copy.addEventListener('click',async()=>{const value=convert(input.value);try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);}else{const temp=document.createElement('textarea');temp.value=value;temp.style.cssText='position:fixed;opacity:0;font-size:16px';document.body.appendChild(temp);temp.focus();temp.select();temp.setSelectionRange(0,value.length);const ok=document.execCommand('copy');temp.remove();if(!ok)throw new Error('copy');}toast('复制成功');}catch(error){toast('请长按转换结果，选择并复制');}});update();
</script></body></html>
